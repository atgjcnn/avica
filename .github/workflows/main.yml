name: RDP
on:
  workflow_dispatch:
    inputs:           # ✅ تم إضافة inputs
      duration:
        description: 'مدة التشغيل (بالدقائق)'
        required: true
        default: '3600'

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: ${{ fromJSON(github.event.inputs.duration) }}  # ✅ تم تصحيح استخدام المتغير
    
    steps:
      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
          netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null  # ✅ تجاهل الخطأ إذا كانت القاعدة غير موجودة
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: Create RDP User with Static Password
        run: |
          $password = "admin@123"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force

          if (-not (Get-LocalUser -Name "TOOLBOXLAP" -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name "TOOLBOXLAP" -Password $securePass -AccountNeverExpires -PasswordNeverExpires  # ✅ إضافة PasswordNeverExpires
          }

          # ✅ التحقق من وجود المجموعات قبل الإضافة
          try {
              Add-LocalGroupMember -Group "Administrators" -Member "TOOLBOXLAP" -ErrorAction SilentlyContinue
              Add-LocalGroupMember -Group "Remote Desktop Users" -Member "TOOLBOXLAP" -ErrorAction SilentlyContinue
          } catch {
              Write-Host "⚠️ المستخدم موجود مسبقاً في المجموعات"
          }

          # ✅ حفظ البيانات بشكل صحيح
          echo "RDP_CREDS=User: TOOLBOXLAP | Password: $password" >> $env:GITHUB_ENV
          echo "RDP_USERNAME=TOOLBOXLAP" >> $env:GITHUB_ENV
          echo "RDP_PASSWORD=$password" >> $env:GITHUB_ENV

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"

          # ✅ التحقق من وجود الملف قبل التحميل
          if (-not (Test-Path $installerPath)) {
              Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
              Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
              Remove-Item $installerPath -Force
          } else {
              Write-Host "✅ Tailscale مثبت مسبقاً"
          }

      - name: Establish Tailscale Connection
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          # ✅ التأكد من وجود Tailscale في PATH
          $tsPath = "$env:ProgramFiles\Tailscale\tailscale.exe"
          if (-not (Test-Path $tsPath)) {
              Write-Error "❌ Tailscale غير موجود!"
              exit 1
          }

          & $tsPath up --authkey=$env:TAILSCALE_AUTH_KEY --hostname="gh-runner-$env:GITHUB_RUN_ID"
          
          # ✅ الحصول على IP مع timeout
          $tsIP = $null
          $retries = 0
          $maxRetries = 15  # ✅ زيادة المحاولات
          
          while (-not $tsIP -and $retries -lt $maxRetries) {
              $tsIP = & $tsPath ip -4 2>$null
              if (-not $tsIP) {
                  Write-Host "⏳ انتظار تعيين IP... ($retries/$maxRetries)"
                  Start-Sleep -Seconds 5
                  $retries++
              }
          }
          
          if (-not $tsIP) {
              Write-Error "❌ فشل الحصول على IP من Tailscale"
              exit 1
          }
          
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
          Write-Host "✅ تم الاتصال بنجاح! IP: $tsIP"

      - name: Verify RDP Accessibility
        run: |
          Write-Host "📡 Tailscale IP: $env:TAILSCALE_IP"
          
          # ✅ اختبار اتصال متقدم
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389 -InformationLevel Quiet
          
          if (-not $testResult) {
              Write-Warning "⚠️ فشل الاتصال المباشر، جرب استخدام localhost"
              $testResult = Test-NetConnection -ComputerName "127.0.0.1" -Port 3389 -InformationLevel Quiet
              
              if (-not $testResult) {
                  Write-Error "❌ RDP لا يستجيب على أي منفذ"
                  exit 1
              }
              Write-Host "✅ RDP يعمل محلياً (127.0.0.1:3389)"
          } else {
              Write-Host "✅ RDP يعمل على Tailscale IP: $env:TAILSCALE_IP:3389"
          }

      - name: Display Connection Info
        run: |
          Clear-Host
          Write-Host @"
          
          ╔══════════════════════════════════════════════════════════╗
          ║     ✅ RDP جاهز للاتصال - TOOLBOXLAP                     ║
          ╠══════════════════════════════════════════════════════════╣
          ║                                                          ║
          ║  📍 Tailscale IP: $env:TAILSCALE_IP                      ║
          ║  👤 Username: TOOLBOXLAP                                 ║
          ║  🔑 Password: admin@123                                  ║
          ║                                                          ║
          ║  ⏱️  المدة: ${{ github.event.inputs.duration }} دقيقة    ║
          ║  🖥️  النظام: Windows Latest                              ║
          ║                                                          ║
          ║  💡 استخدم الأمر التالي للاتصال:                         ║
          ║  mstsc /v:$env:TAILSCALE_IP:3389                         ║
          ║                                                          ║
          ╚══════════════════════════════════════════════════════════╝
          
          "@ | Out-Host

      - name: Maintain Connection
        run: |
          $startTime = Get-Date
          $duration = ${{ github.event.inputs.duration }}
          
          while ($true) {
              $elapsed = (Get-Date) - $startTime
              $remaining = $duration - $elapsed.TotalMinutes
              
              if ($remaining -le 0) {
                  Write-Host "⏰ انتهت المدة المحددة! إيقاف التشغيل..."
                  break
              }
              
              Write-Host "[$(Get-Date -Format 'HH:mm:ss')] ⏱️ مستمر منذ $([math]::Round($elapsed.TotalMinutes,1)) دقيقة | متبقي: $([math]::Round($remaining,1)) دقيقة"
              Start-Sleep -Seconds 60
          }
